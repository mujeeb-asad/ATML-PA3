base_config: configs/base.yaml

# models -> frozen siglip encoder, trainable connector, frozen qwen (lora in stages 2 and 3), thinking disabled
base_model: Qwen/Qwen3-0.6B
model_revision: c1899de289a04d12100db370d81485cdf75e47ca
vision_model: google/siglip-base-patch16-224
vision_revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
visual_tokens: 196                   # the 14 x 14 patch grid. 49 -> the optional 2 x 2 averaged run (configs/task2_49.yaml)
connector_hidden: 1024               # linear 768 -> 1024, gelu, linear 1024 -> 1024 (qwen's hidden size)

# raw sources, downloaded once by prepare_data onto the volume
coco_annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
coco_image_url: http://images.cocodataset.org/{split}/COCO_{split}_{image_id:012d}.jpg
vqa_url: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/{name}.zip
vqa_files: [v2_Questions_Train_mscoco, v2_Questions_Val_mscoco, v2_Annotations_Train_mscoco, v2_Annotations_Val_mscoco,
            v2_Complementary_Pairs_Train_mscoco, v2_Complementary_Pairs_Val_mscoco]
data_dir: data/task2                 # raw metadata, the downloaded images, the selected splits and the cached features

# data sizes (train2014 for training, val2014 for development and final test)
caption_train_images: 6000           # x 3 captions = 18,000 examples
captions_per_train_image: 3
caption_dev_images: 96               # one caption each
vqa_train_pairs: {yes/no: 640, number: 256, other: 640}
vqa_dev_pairs: {yes/no: 12, number: 8, other: 12}
vqa_test_pairs: {yes/no: 36, number: 24, other: 36}
vqa_min_agreement: 8                 # annotators (of 10) behind the normalized consensus answer, on both images
grounding_dev_pairs: {presence: 12, counting: 12}    # 24 pairs / 48 questions
grounding_test_pairs: {presence: 32, counting: 32}   # 64 pairs / 128 questions
grounding_pool_pairs: {presence: 5000, counting: 5000}   # reusable training pools, drawn from the caption training images
count_range: [1, 4]
min_object_area: 0.01                # labelling rule, see prepare_data -> an object counts when it covers >= 1% of the image

# prompts and content-token caps
caption_prompt: Describe this image in one sentence.
presence_template: Does this image contain {object}?
counting_template: How many {objects} can you see?
question_cap: 80
caption_cap: 64
answer_cap: 16

# shared training recipe
micro_batch: 8
grad_accum: 2                        # effective batch 16 -> 4,500 updates x 16 = 72,000 example presentations
adam_betas: [0.9, 0.999]
adam_eps: 1.0e-8
weight_decay: 0.01                   # biases and parameters with fewer than two dimensions are excluded (as in task 1)
max_grad_norm: 1.0
warmup_fraction: 0.05                # per stage, then cosine decay to min_lr_ratio x peak
min_lr_ratio: 0.1
gradient_checkpointing: true
lora: {r: 16, alpha: 32, dropout: 0.05, targets: [q_proj, k_proj, v_proj, o_proj]}
calibration_images: 1024             # caption training images used to calibrate the connector output scale

# the curriculum. a stage draws items with these probabilities. a caption draw in stage 1 is one example, every draw in
# stages 2 and 3 adds two examples (a complete question pair, or two caption examples for replay)
stages:
  - {name: caption, updates: 2250, connector_lr: 1.0e-3, lora_lr: null, mixture: {caption: 1.0}}
  - {name: instruct, updates: 1500, connector_lr: 1.0e-4, lora_lr: 2.0e-5, mixture: {presence: 0.5, counting: 0.25, caption: 0.25}}
  - {name: vqa, updates: 750, connector_lr: 5.0e-5, lora_lr: 1.0e-5, mixture: {vqa: 0.7, presence: 0.1, counting: 0.1, caption: 0.1}}
checkpoint_every: 250                # resumable checkpoints, in main-run updates
dev_eval_every: 500                  # plus update 0 and every stage endpoint

# evaluation
dev_batch_size: 64                   # teacher-forced development metrics, not fixed by the assignment
final_batch_size: 8                  # final generation, fixed by the assignment
max_new_tokens: 16
bootstrap_resamples: 4000
eval_limit_pairs: null               # null -> every pair. only the smoke test sets a number
feature_batch_size: 256              # siglip batch while caching

outputs_dir: outputs/task2_vlm
results_dir: results/task2_vlm
