# shared by every task
seed: 6304
base_config: configs/base.yaml

# supplied rollouts (ATML-PA3-Data, 32 rollouts per question) and the released mathvista question metadata
rollout_drive_folder: https://drive.google.com/drive/folders/1utX-Gfi9vvaoi1mi0pzNpDGL1o1fAh23
mathvista_metadata_url: https://raw.githubusercontent.com/lupantech/MathVista/452b0f83e0079029fb48d1d1b606d3954d812db1/data/testmini.json
datasets: {math: qwen25-math, mathvista: qwen25vl-mathvista}   # dataset name in the files -> folder in ATML-PA3-Data
data_dir: data/task3                 # ATML-PA3-Data/, testmini.json and the joined rollout tables

# splits -> sort the 1,000 question ids, permute with default_rng(6304), first 200 development, the rest evaluation
dev_questions: 200
rollouts_per_question: 32

# offline evaluation
budgets: [1, 2, 4, 8, 16, 32]
orders: 10                           # seeded random permutations of the 32 rollout ids per question, nested prefixes
bootstrap_resamples: 1000            # paired question-level, after averaging over orders
visconf_quantiles: [0.05, 0.95]      # pooled-token calibration over the current candidate set, linear interpolation
visconf_eps: 1.0e-8
trajectory_questions: 3              # illustrative trajectories per dataset (selection rule in offline.py)
trajectory_bins: 50                  # relative-position bins for plotting token signals
question_limit: null                 # null -> every question. only the smoke test sets a number (per split)

# adaptive sampling (step 5)
adaptive_checks: [4, 8, 16]          # stopping checks, otherwise stop at 32
adaptive_taus: [0.5, 0.625, 0.75, 0.875, 1.0]
adaptive_gammas: [0.0, 0.1, 0.25, 0.5]
adaptive_tolerance: 0.01             # dev accuracy at most 1 point below fixed-32 self-consistency
adaptive_quality_score: {math: self_certainty, mathvista: visconf}

# live generation (step 4), the first 50 math evaluation questions
live_questions: 50
live_limit: null                     # null -> all 50. only the smoke test sets a number
live_model: Qwen/Qwen2.5-3B-Instruct
live_revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
system_message: You are a helpful assistant.
question_suffix: "\n\nThink step by step inside <think> </think> tags, then give your final answer inside \\boxed{}."
refine_instruction: "Review the solution above. Identify and correct any errors; if it is correct, retain its answer. Give your final answer inside \\boxed{}."
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.0
single_cap: 3072
parallel_responses: 3
parallel_cap: 1024
refine_cap: 2048

results_dir: results/task3_ttc
